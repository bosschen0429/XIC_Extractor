<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XIC 工作區</title>
    <link rel="stylesheet" href="/assets/workspace.css" />
    <link rel="stylesheet" href="/assets/analysis.css" />
    <script src="/assets/workspace.js" defer></script>
    <script src="/assets/analysis.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">XIC</span>
        <div>
          <h1>XIC 工作區</h1>
          <p>分析與結果檢閱</p>
        </div>
      </div>
      <span class="local-badge"
        ><span aria-hidden="true">●</span> 本機工作區</span
      >
    </header>
    <main>
      <section class="source-card">
        <div class="section-heading">
          <h2 id="batch-title">開啟已完成的分析</h2>
          <span id="batch-count"></span>
        </div>
        <p class="subtle" id="batch-description">
          從既有結果選出想了解的分組，需要時再讀取 RAW 取得 XIC。
        </p>
        <details id="source-settings" open>
          <summary>結果與 RAW 位置</summary>
          <form id="open-form" class="path-line">
            <label for="source">結果資料夾或 SQLite</label
            ><input
              id="source"
              type="text"
              placeholder="選擇批次結果資料夾"
              required
              data-idle
            />
            <button
              type="button"
              data-browse="source"
              data-kind="report"
              data-idle
            >
              瀏覽</button
            ><button class="primary" type="submit" data-idle>開啟批次</button>
          </form>
          <div class="path-line">
            <label for="raw-dir">RAW 資料夾</label
            ><input
              id="raw-dir"
              type="text"
              placeholder="需要取得曲線時使用"
              data-idle
            /><button
              type="button"
              data-browse="raw-dir"
              data-kind="folder"
              data-idle
            >
              瀏覽
            </button>
          </div>
          <div class="path-line">
            <label for="dll-dir">RawFileReader DLL</label
            ><input
              id="dll-dir"
              type="text"
              placeholder="Thermo RawFileReader DLL 資料夾"
              data-idle
            /><button
              type="button"
              data-browse="dll-dir"
              data-kind="folder"
              data-idle
            >
              瀏覽
            </button>
          </div>
        </details>
      </section>
      <div id="status" class="status" role="status" aria-live="polite">
        請開啟一個批次。
      </div>
      <section id="review" class="review-grid" hidden>
        <aside class="list-panel">
          <form id="query-form">
            <div class="section-heading">
              <h2>檢閱項目</h2>
              <button
                type="button"
                id="reset-query"
                class="text-button"
                data-idle
              >
                重設
              </button>
            </div>
            <p class="subtle">搜尋這個批次的全部已儲存項目</p>
            <div class="range-fields">
              <label class="field"
                >m/z 下限<input
                  id="mz-min"
                  type="number"
                  step="any"
                  data-idle /></label
              ><label class="field"
                >上限<input id="mz-max" type="number" step="any" data-idle
              /></label>
            </div>
            <div class="range-fields">
              <label class="field"
                >RT 起點（min）<input
                  id="rt-min"
                  type="number"
                  step="any"
                  data-idle /></label
              ><label class="field"
                >終點<input id="rt-max" type="number" step="any" data-idle
              /></label>
            </div>
            <details class="query-advanced">
              <summary>進階定位</summary>
              <label class="field"
                >完整分組 ID<input
                  id="group-id"
                  type="text"
                  placeholder="從來源明細複製的識別碼"
                  data-idle
              /></label>
            </details>
            <button class="search-button" type="submit" data-idle>
              搜尋全批結果
            </button>
          </form>
          <div id="list-summary" class="list-summary"></div>
          <div id="item-list" class="item-list" aria-label="查詢結果"></div>
          <div class="pagination">
            <button id="previous" type="button">上一頁</button
            ><span id="page-label"></span
            ><button id="next" type="button">下一頁</button>
          </div>
        </aside>
        <section class="detail-card">
          <div id="selection-empty" class="empty">
            <span class="empty-symbol" aria-hidden="true">↖</span>
            <h2>選擇一個項目開始檢閱</h2>
            <p>查看當次分析紀錄，或為選定樣本取得 XIC。</p>
          </div>
          <div id="selection" hidden>
            <div class="detail-heading">
              <div>
                <span class="eyebrow" id="item-kind"></span>
                <h2 id="item-title"></h2>
              </div>
              <a id="download" class="button-link" hidden>下載目前檢閱頁</a>
            </div>
            <details class="identity">
              <summary>來源明細</summary>
              <code id="item-identity"></code>
            </details>
            <section class="acquisition-panel">
              <div class="section-heading">
                <h3>按需取得 XIC</h3>
                <span id="sample-count"></span>
              </div>
              <p class="subtle">
                選擇少數樣本，讀取保留峰頂附近的
                RAW。缺少觀測座標的樣本無法自動擷取。
              </p>
              <div id="sample-list" class="sample-list"></div>
              <div class="acquisition-actions">
                <details class="parameters">
                  <summary>擷取範圍</summary>
                  <div>
                    <label
                      >m/z 容差
                      <input
                        id="ppm"
                        type="number"
                        min="0.0001"
                        step="any"
                        value="5"
                        data-idle
                      />
                      ppm</label
                    ><label
                      >峰頂前後
                      <input
                        id="padding"
                        type="number"
                        min="0.0001"
                        step="any"
                        value="0.5"
                        data-idle
                      />
                      min</label
                    >
                  </div>
                </details>
                <button id="load-curves" type="button" class="primary">
                  載入所選樣本 XIC</button
                ><button id="cancel" type="button" hidden>取消載入</button>
              </div>
              <div id="job-progress" class="job-progress" hidden>
                <progress id="progress"></progress
                ><span id="job-message"></span>
              </div>
            </section>
            <div class="tabs" role="tablist" aria-label="檢閱來源">
              <button
                id="tab-recorded"
                type="button"
                role="tab"
                aria-selected="true"
              >
                當次分析紀錄</button
              ><button
                id="tab-curves"
                type="button"
                role="tab"
                aria-selected="false"
                disabled
              >
                新取得 XIC
              </button>
            </div>
            <p id="view-note" class="view-note"></p>
            <iframe
              id="inspector"
              title="XIC Inspector 檢閱內容"
              src="about:blank"
            ></iframe>
          </div>
        </section>
      </section>
    </main>
    <dialog id="browser-dialog">
      <div class="section-heading">
        <h2>選擇本機位置</h2>
        <button id="browse-close" type="button" aria-label="關閉位置選擇">
          ×
        </button>
      </div>
      <form id="browse-form">
        <input id="browse-path" type="text" aria-label="資料夾路徑" /><button
          type="submit"
        >
          前往
        </button>
      </form>
      <div class="browse-actions">
        <button id="browse-parent" type="button">上一層</button
        ><button id="browse-use" type="button" class="primary">
          使用此資料夾
        </button>
      </div>
      <p id="browse-note" class="subtle" role="status"></p>
      <div id="browse-entries"></div>
    </dialog>
  </body>
</html>
