<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1140 678" role="img" lang="zh-TW" aria-labelledby="archify-diagram-title archify-diagram-description" xmlns="http://www.w3.org/2000/svg" width="1140" height="678" style="background: #fff; font-family: Consolas, 'Microsoft JhengHei', monospace">
  <style>
svg {
  --grid: #e9edf2;
  --text: #111827;
  --text-muted: #5b6474;
  --lane-stroke: #cbd5e1;
  --arrow: #64748b;
  --mask: #ffffff;
  --frontend-fill: rgba(34, 211, 238, 0.15);
  --frontend-stroke: #0891b2;
  --backend-fill: rgba(52, 211, 153, 0.18);
  --backend-stroke: #059669;
  --database-fill: rgba(167, 139, 250, 0.2);
  --database-stroke: #7c3aed;
  --external-fill: rgba(148, 163, 184, 0.18);
  --external-stroke: #64748b;
}
.c-grid { stroke: var(--grid); fill: none; }
.c-mask { fill: var(--mask); stroke: none; }
.c-frontend { fill: var(--frontend-fill);   stroke: var(--frontend-stroke); }
.c-backend { fill: var(--backend-fill);    stroke: var(--backend-stroke); }
.c-database { fill: var(--database-fill);   stroke: var(--database-stroke); }
.c-external { fill: var(--external-fill);   stroke: var(--external-stroke); }
.t-primary { fill: var(--text); }
.t-muted { fill: var(--text-muted); }
.t-edge-default { fill: var(--arrow); }
svg .semantic-sigil { fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.76;
      pointer-events: none; }
svg .semantic-sigil &gt; * { vector-effect: non-scaling-stroke; }
svg .semantic-sigil .sigil-fill { fill: currentColor; stroke: none; }
svg .s-frontend { color: var(--frontend-stroke); }
svg .s-backend { color: var(--backend-stroke); }
svg .s-database { color: var(--database-stroke); }
svg .s-external { color: var(--external-stroke); }
.a-default { stroke: var(--arrow); fill: none; }
.m-default { fill: var(--arrow); }
.c-mask.edge-label { rx: 7px; stroke: var(--lane-stroke); stroke-width: .75px; }
</style>
  <title id="archify-diagram-title">系統分工：判斷、執行資源與發布各有邊界</title>
  <desc id="archify-diagram-description">由 Archify 產生的架構圖。</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <g>
    <path d="M 320 85 L 440 85" fill="none" stroke="var(--mask)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" pointer-events="none" />
    <path d="M 320 85 L 440 85" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>
  <g>
    <path d="M 720 85 L 840 85" fill="none" stroke="var(--mask)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" pointer-events="none" />
    <path d="M 720 85 L 840 85" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>
  <g>
    <path d="M 180 130 L 180 280" fill="none" stroke="var(--mask)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" pointer-events="none" />
    <path d="M 180 130 L 180 280" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>
  <g>
    <path d="M 180 370 L 180 520" fill="none" stroke="var(--mask)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" pointer-events="none" />
    <path d="M 180 370 L 180 520" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>
  <g>
    <path d="M 970 130 L 970 280" fill="none" stroke="var(--mask)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" pointer-events="none" />
    <path d="M 970 130 L 970 280" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>
  <g>
    <path d="M 970 370 L 970 520" fill="none" stroke="var(--mask)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" pointer-events="none" />
    <path d="M 970 370 L 970 520" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>
  <g>
    <title>入口與工作協調 · HTML／CLI 將請求交給正式 owners · 架構元件</title>
    <rect x="40" y="40" width="280" height="90" rx="8" class="c-mask" />
    <rect x="40" y="40" width="280" height="90" rx="8" class="c-frontend" stroke-width="1.25px" />
    <g aria-hidden="true" class="semantic-sigil s-frontend" transform="translate(46 46) scale(0.6875)">
      <rect x="2" y="3" width="12" height="10" rx="2" />
      <path d="M2 6.5h12" />
      <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill" />
      <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill" />
    </g>
    <text x="180" y="83" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">入口與工作協調</text>
    <text x="180" y="99" class="t-muted" font-size="9" text-anchor="middle">HTML／CLI 將請求交給正式 owners</text>
  </g>
  <g>
    <title>科學 owner 做判斷 · 觀察、群組、格值與完成結果 · 架構元件</title>
    <rect x="440" y="40" width="280" height="90" rx="8" class="c-mask" />
    <rect x="440" y="40" width="280" height="90" rx="8" class="c-backend" stroke-width="1.25px" />
    <g aria-hidden="true" class="semantic-sigil s-backend" transform="translate(446 46) scale(0.6875)">
      <path d="M6 3 3 8l3 5M10 3l3 5-3 5" />
    </g>
    <text x="580" y="83" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">科學 owner 做判斷</text>
    <text x="580" y="99" class="t-muted" font-size="9" text-anchor="middle">觀察、群組、格值與完成結果</text>
  </g>
  <g>
    <title>完成模型才進入發布 · 結果封存、staging 與各自 writer · 架構元件</title>
    <rect x="840" y="40" width="260" height="90" rx="8" class="c-mask" />
    <rect x="840" y="40" width="260" height="90" rx="8" class="c-backend" stroke-width="1.25px" />
    <g aria-hidden="true" class="semantic-sigil s-backend" transform="translate(846 46) scale(0.6875)">
      <path d="M6 3 3 8l3 5M10 3l3 5-3 5" />
    </g>
    <text x="970" y="83" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">完成模型才進入發布</text>
    <text x="970" y="99" class="t-muted" font-size="9" text-anchor="middle">結果封存、staging 與各自 writer</text>
  </g>
  <g>
    <title>執行資源與排程 · worker、取消、失敗聚合與清理 · 架構元件</title>
    <rect x="40" y="280" width="280" height="90" rx="8" class="c-mask" />
    <rect x="40" y="280" width="280" height="90" rx="8" class="c-backend" stroke-width="1.25px" />
    <g aria-hidden="true" class="semantic-sigil s-backend" transform="translate(46 286) scale(0.6875)">
      <path d="M6 3 3 8l3 5M10 3l3 5-3 5" />
    </g>
    <text x="180" y="323" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">執行資源與排程</text>
    <text x="180" y="339" class="t-muted" font-size="9" text-anchor="middle">worker、取消、失敗聚合與清理</text>
  </g>
  <g>
    <title>中斷也要有終態與收尾 · 取消或失敗不等於完成交付 · 架構元件</title>
    <rect x="40" y="520" width="280" height="90" rx="8" class="c-mask" />
    <rect x="40" y="520" width="280" height="90" rx="8" class="c-external" stroke-width="1.25px" />
    <g aria-hidden="true" class="semantic-sigil s-external" transform="translate(46 526) scale(0.6875)">
      <rect x="2.5" y="5" width="8.5" height="8" rx="1.5" />
      <path d="M8 2.5h5.5V8M13.5 2.5 7.5 8.5" />
    </g>
    <text x="180" y="563" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">中斷也要有終態與收尾</text>
    <text x="180" y="579" class="t-muted" font-size="9" text-anchor="middle">取消或失敗不等於完成交付</text>
  </g>
  <g>
    <title>保存的 workbook／Matrix／證據 · 完成產物保留自己的來源與身分 · 架構元件</title>
    <rect x="840" y="280" width="260" height="90" rx="8" class="c-mask" />
    <rect x="840" y="280" width="260" height="90" rx="8" class="c-database" stroke-width="1.25px" />
    <g aria-hidden="true" class="semantic-sigil s-database" transform="translate(846 286) scale(0.6875)">
      <ellipse cx="8" cy="4" rx="5" ry="2" />
      <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2" />
    </g>
    <text x="970" y="323" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">保存的 workbook／Matrix／證據</text>
    <text x="970" y="339" class="t-muted" font-size="9" text-anchor="middle">完成產物保留自己的來源與身分</text>
  </g>
  <g>
    <title>Inspector 只讀檢閱 · 按需 XIC 仍由 acquisition 取得 · 架構元件</title>
    <rect x="840" y="520" width="260" height="90" rx="8" class="c-mask" />
    <rect x="840" y="520" width="260" height="90" rx="8" class="c-frontend" stroke-width="1.25px" />
    <g aria-hidden="true" class="semantic-sigil s-frontend" transform="translate(846 526) scale(0.6875)">
      <rect x="2" y="3" width="12" height="10" rx="2" />
      <path d="M2 6.5h12" />
      <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill" />
      <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill" />
    </g>
    <text x="970" y="563" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Inspector 只讀檢閱</text>
    <text x="970" y="579" class="t-muted" font-size="9" text-anchor="middle">按需 XIC 仍由 acquisition 取得</text>
  </g>
  <g>
    <rect x="355.8" y="65" width="48.4" height="14" rx="3" class="c-mask edge-label" />
    <text x="380" y="75" class="t-edge-default" font-size="8" text-anchor="middle">委派判斷</text>
  </g>
  <g>
    <rect x="755.8" y="65" width="48.4" height="14" rx="3" class="c-mask edge-label" />
    <text x="780" y="75" class="t-edge-default" font-size="8" text-anchor="middle">完成答案</text>
  </g>
  <g>
    <rect x="125.60000000000001" y="198" width="48.4" height="14" rx="3" class="c-mask edge-label" />
    <text x="149.8" y="208" class="t-edge-default" font-size="8" text-anchor="middle">安排執行</text>
  </g>
  <g>
    <rect x="125.60000000000001" y="438" width="48.4" height="14" rx="3" class="c-mask edge-label" />
    <text x="149.8" y="448" class="t-edge-default" font-size="8" text-anchor="middle">終態收尾</text>
  </g>
  <g>
    <rect x="934" y="198" width="30" height="14" rx="3" class="c-mask edge-label" />
    <text x="949" y="208" class="t-edge-default" font-size="8" text-anchor="middle">發布</text>
  </g>
  <g>
    <rect x="934" y="438" width="30" height="14" rx="3" class="c-mask edge-label" />
    <text x="949" y="448" class="t-edge-default" font-size="8" text-anchor="middle">讀取</text>
  </g>
  <g>
    <text x="40" y="642" class="t-primary" font-size="12" font-weight="650">圖例</text>
    <g>
      <rect x="40" y="653" width="16" height="10" rx="2.5" class="c-frontend" stroke-width="1" />
      <text x="62" y="662" class="t-muted" font-size="10" font-weight="500">前端</text>
    </g>
    <g>
      <rect x="130" y="653" width="16" height="10" rx="2.5" class="c-backend" stroke-width="1" />
      <text x="152" y="662" class="t-muted" font-size="10" font-weight="500">後端</text>
    </g>
    <g>
      <rect x="220" y="653" width="16" height="10" rx="2.5" class="c-database" stroke-width="1" />
      <text x="242" y="662" class="t-muted" font-size="10" font-weight="500">資料庫</text>
