    <title>開始 Targeted 分析 · 由正式 application 協調本次工作 · 架構元件</title>
    <rect x="440" y="240" width="280" height="90" rx="8" class="c-mask" />
    <rect x="440" y="240" width="280" height="90" rx="8" class="c-backend" stroke-width="1.25px" />
