    <text x="970" y="283" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">取消或失敗</text>
    <text x="970" y="299" class="t-muted" font-size="9" text-anchor="middle">不當成完成的 workbook 交付</text>
