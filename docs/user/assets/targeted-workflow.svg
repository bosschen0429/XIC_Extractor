    <title>共用核心完成格值 · 峰證據、跨樣本判斷與固定列投影 · 架構元件</title>
    <rect x="440" y="440" width="280" height="90" rx="8" class="c-mask" />
    <rect x="440" y="440" width="280" height="90" rx="8" class="c-backend" stroke-width="1.25px" />
