  <g>
    <rect x="751" y="265" width="58" height="14" rx="3" class="c-mask edge-label" />
    <text x="780" y="275" class="t-edge-default" font-size="8" text-anchor="middle">取消／失敗</text>
  </g>
  <g>
    <text x="40" y="962" class="t-primary" font-size="12" font-weight="650">圖例</text>
    <g>
      <rect x="40" y="973" width="16" height="10" rx="2.5" class="c-frontend" stroke-width="1" />
