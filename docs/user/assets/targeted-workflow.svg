  </g>
  <g>
    <title>完成才發布 Excel · 結果、摘要與必要的待檢查項目 · 架構元件</title>
    <rect x="440" y="640" width="280" height="90" rx="8" class="c-mask" />
    <rect x="440" y="640" width="280" height="90" rx="8" class="c-database" stroke-width="1.25px" />
