  </g>
  <g>
    <rect x="525.5999999999999" y="578" width="48.4" height="14" rx="3" class="c-mask edge-label" />
    <text x="549.8" y="588" class="t-edge-default" font-size="8" text-anchor="middle">完成答案</text>
  </g>
  <g>
    <rect x="525.5999999999999" y="778" width="48.4" height="14" rx="3" class="c-mask edge-label" />
    <text x="549.8" y="788" class="t-edge-default" font-size="8" text-anchor="middle">先看總覽</text>
