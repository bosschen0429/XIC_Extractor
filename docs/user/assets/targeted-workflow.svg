  </g>
  <g>
    <title>準備這一批的輸入 · RAW／DLL 路徑與目標方法 · 架構元件</title>
    <rect x="40" y="40" width="280" height="90" rx="8" class="c-mask" />
    <rect x="40" y="40" width="280" height="90" rx="8" class="c-frontend" stroke-width="1.25px" />
    <g aria-hidden="true" class="semantic-sigil s-frontend" transform="translate(46 46) scale(0.6875)">
      <rect x="2" y="3" width="12" height="10" rx="2" />
      <path d="M2 6.5h12" />
      <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill" />
      <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill" />
    </g>
    <text x="180" y="83" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">準備這一批的輸入</text>
    <text x="180" y="99" class="t-muted" font-size="9" text-anchor="middle">RAW／DLL 路徑與目標方法</text>
  </g>
  <g>
    <title>確認目標與內標配對 · 匯入先預覽，確認後才取代清單 · 架構元件</title>
    <rect x="440" y="40" width="280" height="90" rx="8" class="c-mask" />
    <rect x="440" y="40" width="280" height="90" rx="8" class="c-frontend" stroke-width="1.25px" />
    <g aria-hidden="true" class="semantic-sigil s-frontend" transform="translate(446 46) scale(0.6875)">
      <rect x="2" y="3" width="12" height="10" rx="2" />
      <path d="M2 6.5h12" />
      <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill" />
