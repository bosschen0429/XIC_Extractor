    <text x="580" y="683" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">完成才發布 Excel</text>
    <text x="580" y="699" class="t-muted" font-size="9" text-anchor="middle">結果、摘要與必要的待檢查項目</text>
  </g>
  <g>
    <title>從總覽選擇要看的結果 · workbook 或工作區只讀檢閱 · 架構元件</title>
    <rect x="440" y="840" width="280" height="90" rx="8" class="c-mask" />
    <rect x="440" y="840" width="280" height="90" rx="8" class="c-frontend" stroke-width="1.25px" />
    <g aria-hidden="true" class="semantic-sigil s-frontend" transform="translate(446 846) scale(0.6875)">
