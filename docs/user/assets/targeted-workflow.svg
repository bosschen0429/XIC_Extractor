      <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill" />
    </g>
    <text x="580" y="883" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">從總覽選擇要看的結果</text>
    <text x="580" y="899" class="t-muted" font-size="9" text-anchor="middle">workbook 或工作區只讀檢閱</text>
  </g>
  <g>
    <title>取消或失敗 · 不當成完成的 workbook 交付 · 架構元件</title>
    <rect x="840" y="240" width="260" height="90" rx="8" class="c-mask" />
    <rect x="840" y="240" width="260" height="90" rx="8" class="c-external" stroke-width="1.25px" />
