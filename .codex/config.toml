# XIC runs in a Windows-native sandbox. Git for this repository must not load
# the user-home global config because elevated sandbox users cannot read it.
# Required identity and long-path settings live in this repository's shared
# local Git config instead.
default_permissions = "workspace-github"

[permissions.workspace-github]
description = "XIC workspace writes, bounded Git metadata writes, and narrow GitHub access."
extends = ":workspace"

[permissions.workspace-github.filesystem.":workspace_roots"]
".git" = "write"
".codex" = "read"
".agents" = "read"

[permissions.workspace-github.network]
enabled = true

[permissions.workspace-github.network.domains]
"api.github.com" = "allow"
"github.com" = "allow"

[shell_environment_policy.set]
GIT_CONFIG_GLOBAL = "NUL"
