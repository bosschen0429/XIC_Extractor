interface:
  display_name: "XIC Performance Diagnosis"
  short_description: "Prove XIC bottlenecks and baseline/candidate comparability"
  default_prompt: "Use $xic-performance-diagnosis to bind the XIC workload and timing source, prove baseline/candidate comparability when paired artifacts exist, explain stage and RAW/XIC call-cost deltas, and keep correctness and product authority separate before any optimization handoff."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "repo-local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "neutral-source-plus-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
