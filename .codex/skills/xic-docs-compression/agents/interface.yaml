interface:
  display_name: "XIC Docs Compression"
  short_description: "Digest XIC docs into one owner and a safe retirement action"
  default_prompt: "Use $xic-docs-compression to audit the selected XIC document family, absorb its durable meaning into one canonical repo owner, route construction and history to the owner's current surfaces, and verify referrer and retirement safety within existing authorization."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths:
      - "docs/superpowers/"
      - "docs/product/"
      - "docs/agent/"
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "repo-local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "neutral-source-plus-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
