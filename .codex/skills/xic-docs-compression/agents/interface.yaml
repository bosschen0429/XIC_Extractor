interface:
  display_name: "XIC Docs Compression"
  short_description: "Consolidate XIC docs around current owners and consumers"
  default_prompt: "Use $xic-docs-compression to inspect the selected XIC document family, preserve useful claims in their canonical repo owners, repair referrers, and remove redundant documents within existing authorization."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths:
      - "docs/superpowers/"
      - "docs/product/"
      - "docs/agent/"
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "repo-local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "neutral-source-plus-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
