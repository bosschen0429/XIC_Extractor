    @media(max-width:760px){body{padding:12px}.notice{margin:-12px -12px 10px}.header-main{align-items:flex-start}.header-actions .badge{display:none}.workbench{grid-template-columns:1fr}.list-panel{position:static;max-height:260px}.record-reason{display:none}.detail-panel{padding:16px}.fact-row{gap:8px 18px}.sample-actions{justify-content:flex-start}.relationship-top{grid-template-columns:1fr}.relationship-detail{border-left:0;border-top:1px solid var(--line)}.relationship-lane{grid-template-columns:105px minmax(0,1fr);gap:8px;padding:12px 8px}.relation-section-heading{padding:12px}.lane-name{display:block}.injection-order{margin-right:5px}.lane-chart svg{height:100px}}
