minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: internal-defense-growth
        name: Block new internal-defense machinery and handwritten ppm arithmetic
        entry: uv run --cache-dir .uv-cache python scripts/check_architecture_census.py --internal-defense-base HEAD --staged
        language: system
        files: ^((xic_extractor|scripts|tools|xic_inspector|xic_workbench)/.*\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false

      - id: ruff-format-staged-python
        name: Ruff format staged Python files
        entry: uv run --cache-dir .uv-cache ruff format
        language: system
        types: [python]

      - id: ruff-staged-python
        name: Ruff staged Python files
        entry: uv run --cache-dir .uv-cache ruff check --fix
        language: system
        types: [python]

      - id: mypy-staged-package
        name: mypy staged package files
        entry: uv run --cache-dir .uv-cache mypy
        language: system
        require_serial: true
        files: ^(xic_extractor|scripts|xic_workbench|xic_inspector|tools)/.*\.py$
        types: [python]
