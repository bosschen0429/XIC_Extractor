minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: ruff-staged-python
        name: Ruff staged Python files
        entry: uv run --cache-dir .uv-cache ruff check --fix
        language: system
        types: [python]

      - id: mypy-staged-package
        name: mypy staged xic_extractor files
        entry: uv run --cache-dir .uv-cache mypy
        language: system
        files: ^xic_extractor/.*\.py$
        types: [python]

      - id: pytest-staged-tests
        name: pytest staged test files
        entry: uv run --cache-dir .uv-cache pytest -q
        language: system
        files: ^tests/.*\.py$
        types: [python]

      - id: test-shard-coverage
        name: Test shard coverage
        entry: uv run --cache-dir .uv-cache python -m tools.testing.test_shards --check
        language: system
        files: ^(tests/.*\.py|tools/testing/test_shards\.py)$
        pass_filenames: false
