minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: ruff-staged-python
        name: Ruff staged Python files
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: mypy-staged-package
        name: mypy staged xic_extractor files
        entry: uv run mypy
        language: system
        files: ^xic_extractor/.*\.py$
        types: [python]

      - id: pytest-staged-tests
        name: pytest staged test files
        entry: uv run pytest -q
        language: system
        files: ^tests/.*\.py$
        types: [python]
