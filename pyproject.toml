[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xic-extractor"
version = "0.2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PyQt6>=6.6",
    "matplotlib>=3.10.9",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pythonnet>=3.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "grimp>=3.15,<4",
    "import-linter>=2.13,<3",
    "pyarrow>=25.0.0,<26",
    "pyinstaller>=6.22,<7",
    "pytest>=8",
    "pytest-cov>=5.0",
    "wheel>=0.45,<1",
]
parquet = [
    "pyarrow>=25.0.0,<26",
]

[project.scripts]
xic-extractor = "gui.main:main"
xic-extractor-cli = "scripts.run_extraction:main"
xic-discovery-cli = "scripts.run_discovery:main"
xic-untargeted-cid-nl-real-data-cli = "scripts.run_untargeted_cid_nl_real_data:main"
xic-untargeted-cid-nl-mode-track-cli = "scripts.run_untargeted_cid_nl_mode_track:main"
xic-untargeted-provisional-matrix-cli = "scripts.run_untargeted_provisional_matrix:main"
xic-pt-pattern-discovery-cli = "scripts.run_pt_pattern_discovery:main"
xic-align-cli = "scripts.run_alignment:main"
xic-align-validate-cli = "scripts.run_alignment_validation:main"

[tool.setuptools.packages.find]
include = ["gui*", "scripts*", "tools*", "xic_extractor*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"xic_extractor.alignment" = ["data/issue256_quantitative_projection_authority_v1.json"]
"xic_extractor.presets.data" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -p no:tmpdir"
markers = [
    "ledger_snapshot: pins a recorded value from docs/superpowers/validation/, so a legitimate re-analysis turns it red. Excluded from CI shards; run with `python -m tools.testing.test_shards --snapshots`. A test whose subject is checker behaviour must stay unmarked and run in CI: rejection paths, monkeypatched dependencies, and invariants that survive a consistent re-run are not snapshots even when they read a register.",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ipython>=8.39.0",
    "mypy>=1.20.1",
    "pre-commit>=4.6.1",
    "ruff>=0.15.11",
]
