[build-system]
requires = ["setuptools>=69", "wheel", "Cython>=3.1,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "xic-extractor"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PyQt6>=6.6",
    "ijson>=3.4,<4",
    "matplotlib>=3.10.9",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pythonnet>=3.0",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "grimp>=3.15,<4",
    "import-linter>=2.13,<3",
    "pyarrow>=25.0.0,<26",
    "pyinstaller>=6.22,<7",
    "pytest>=8",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8,<4",
    "wheel>=0.45,<1",
]
parquet = [
    "pyarrow>=25.0.0,<26",
]

[project.scripts]
xic-extractor = "gui.main:main"
xic-extractor-cli = "scripts.run_extraction:main"
xic-discovery-cli = "scripts.run_discovery:main"
xic-untargeted-cid-nl-real-data-cli = "scripts.run_untargeted_cid_nl_real_data:main"
xic-untargeted-cid-nl-mode-track-cli = "scripts.run_untargeted_cid_nl_mode_track:main"
xic-untargeted-provisional-matrix-cli = "scripts.run_untargeted_provisional_matrix:main"
xic-pt-pattern-discovery-cli = "scripts.run_pt_pattern_discovery:main"
xic-align-cli = "scripts.run_alignment:main"
xic-feature-quality = "scripts.run_feature_quality:main"
xic-inspector = "xic_inspector.cli:main"

[tool.setuptools.packages.find]
include = ["gui*", "scripts*", "tools*", "xic_extractor*", "xic_inspector*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"xic_extractor.alignment" = ["data/quantitative_projection_authority.json", "*.pyx"]
"xic_extractor.presets.data" = ["*.toml"]
"xic_extractor.discovery" = ["data/*"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "xic_extractor/alignment/_completion_receipt_native.pyx" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -p no:tmpdir"
markers = [
    "agent_hooks: validates the repository Codex hook configuration and policy scripts under .codex/. Run for changes to .codex/ hook files or this test and on the primary main-branch test job.",
    "ledger_snapshot: pins a recorded value from docs/superpowers/validation/, so a legitimate re-analysis turns it red. Excluded from CI shards; run with `python -m tools.testing.test_shards --snapshots`. Only direct decorators on top-level synchronous test functions are supported; the inventory rejects class, method, async, and module-level placement. A test whose subject is checker behaviour must stay unmarked and run in CI: rejection paths, monkeypatched dependencies, and invariants that survive a consistent re-run are not snapshots even when they read a register.",
    "current_repository_census: validates the current checkout's complete architecture census. CI runs this once in the lint job; the main pytest sessions exclude it to avoid rebuilding the same repository-wide graph.",
    "packaging_build: builds installable wheel or PyInstaller outputs. Run for packaging-authority changes and on the primary main-branch test job; ordinary PRs and compatibility runs keep the cheaper packaging contract tests.",
    "product_governance: validates productization schemas, authority manifests, product docs, and their checker. Run for changes to those owners and on the primary main-branch test job.",
    "serial_ci: uses a subprocess or build path whose bounded timeout is not parallel-safe on the self-hosted runner. CI runs these explicit node IDs after the parallel session.",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ipython>=8.39.0",
    "mypy>=1.20.1",
    "pre-commit>=4.6.1",
    "ruff>=0.15.11",
]
