[build-system]
requires = ["setuptools>=69", "wheel", "markdown-it-py>=4.2,<5"]
build-backend = "setuptools.build_meta"

[project]
name = "xic-extractor"
version = "1.0.2"
requires-python = ">=3.15,<3.16"
dependencies = [
    "ijson>=3.4,<4",
    "markdown-it-py>=4.2,<5",
    "matplotlib>=3.10.9",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pythonnet>=3.2.1",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "grimp>=3.15,<4",
    "import-linter>=2.13,<3",
    "packaging>=24",
    "playwright>=1.56,<2",
    "pyinstaller>=6.22,<7",
    "pytest>=8",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8,<4",
    "wheel>=0.45,<1",
]

[project.scripts]
xic-extractor = "xic_workbench.cli:main"
xic-extractor-cli = "scripts.run_extraction:main"
xic-discovery-cli = "scripts.run_discovery:main"
xic-delta-mass-discovery-cli = "scripts.run_delta_mass_discovery:main"
xic-align-cli = "scripts.run_alignment:main"
xic-matrix-curation = "scripts.run_matrix_curation:main"
xic-install-thermo-reader = "scripts.install_thermo_reader:main"
xic-inspector = "xic_inspector.cli:main"
xic-workbench = "xic_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["scripts*", "tools*", "xic_extractor*", "xic_inspector*", "xic_workbench*"]
exclude = ["tests*"]

[tool.setuptools.cmdclass]
build_py = "tools.build_user_guides.BuildPy"

[tool.setuptools.package-data]
"xic_inspector.rendering" = ["assets/*.html", "assets/*.js", "assets/*.css"]
"xic_workbench" = ["assets/*.html", "assets/*.js", "assets/*.css"]
"xic_extractor.presets.data" = ["*.toml"]
"xic_extractor.discovery" = ["data/*"]
"xic_extractor.configuration" = ["data/*.csv", "data/*.json", "data/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p tools.testing.pytest_temp --tb=short"
tmp_path_retention_policy = "failed"
markers = [
    "windows_only: exercises Windows-specific DLL loading or file-locking behavior. CI runs these only in the Windows integration lane.",
    "requires_dotnet: exercises a real managed .NET runtime, not a fake RAW reader. CI covers these in the Linux lane with CoreCLR.",
    "browser_e2e: runs the shipped HTML workbench in locked Playwright Chromium without RAW/DLL analysis. CI selects this on workbench/review and browser-test infrastructure changes and on master.",
    "current_repository_census: validates the current checkout's complete architecture census. CI runs this once in the lint job; the main pytest sessions exclude it to avoid rebuilding the same repository-wide graph.",
    "packaging_build: builds installable wheel or PyInstaller outputs. CI runs these serially in the Windows integration lane for packaging-authority changes and on master; other PRs keep the cheaper packaging contract tests.",
    "ci_workflow: replays CI workflow steps in PowerShell with faked child commands. Selection runs these when the workflow or test-selection tooling changes, and on master.",
    "serial_ci: uses a subprocess or build path whose bounded timeout is not parallel-safe on the self-hosted runner. CI runs these explicit node IDs after the parallel session.",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "ipython>=8.39.0",
    "mypy>=1.20.1",
    "pre-commit>=4.6.1",
    "ruff>=0.15.11",
]

[tool.importlinter]
# Static import graph only; dynamic loaders require targeted contracts.
root_packages = [
    "xic_extractor",
    "scripts",
    "tools",
    "xic_inspector",
    "xic_workbench",
]
exclude_type_checking_imports = false
include_external_packages = true

[[tool.importlinter.contracts]]
id = "domain-no-outer-layer"
name = "Domain does not import outer layers"
type = "forbidden"
source_modules = ["xic_extractor"]
forbidden_modules = [
    "scripts",
    "tools",
    "xic_inspector",
    "xic_workbench",
]
allow_indirect_imports = false

