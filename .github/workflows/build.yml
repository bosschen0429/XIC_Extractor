name: Build Desktop Packages

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload as artifact (for testing without a tag)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          python-version: "3.15"

      - name: Install locked dependencies
        shell: pwsh
        run: uv sync --locked --extra dev --group dev --python 3.15

      - name: Verify same-SHA CI for release
        id: verify_ci
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$env:GITHUB_SHA&status=completed&per_page=100"
          $runs = Invoke-RestMethod -Uri $uri -Headers @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $verified = @($runs.workflow_runs | Where-Object {
            $_.head_sha -eq $env:GITHUB_SHA -and $_.conclusion -eq "success"
          })
          if ($verified.Count -eq 0) {
            throw "Release requires successful ci.yml checks for exactly $env:GITHUB_SHA"
          }
          Write-Host "Verified CI run $($verified[0].id) for $env:GITHUB_SHA"

      - name: Determine package metadata
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $projectVersion = & .\.venv\Scripts\python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF.StartsWith("refs/tags/")) {
            $packageVersion = $env:GITHUB_REF_NAME
            if ($packageVersion -cne "v$projectVersion") {
              throw "Tag $packageVersion does not match project version v$projectVersion"
            }
          } else {
            $packageVersion = "v$projectVersion-dev"
          }

          $artifactStem = "XIC_Extractor-Windows-$packageVersion"
          "version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_stem=$artifactStem" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build executable
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m PyInstaller packaging/xic_extractor.spec --clean --noconfirm

      - name: Package distribution
        shell: pwsh
        env:
          ARTIFACT_STEM: ${{ steps.meta.outputs.artifact_stem }}
        run: |
          $artifactStem = $env:ARTIFACT_STEM
          $stageDir = Join-Path $env:RUNNER_TEMP $artifactStem
          $archivePath = Join-Path "dist" "$artifactStem.zip"

          if (Test-Path $stageDir) {
            Remove-Item $stageDir -Recurse -Force
          }
          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }

          New-Item -ItemType Directory -Path $stageDir | Out-Null
          Copy-Item "dist\XIC_Extractor\*" $stageDir -Recurse
          New-Item -ItemType Directory -Path (Join-Path $stageDir "output") -Force | Out-Null
          Copy-Item "README.md" (Join-Path $stageDir "README.md")

          Compress-Archive -Path $stageDir -DestinationPath $archivePath -Force

      - name: Smoke the delivered archive
        id: smoke_archive
        shell: pwsh
        env:
          ARTIFACT_STEM: ${{ steps.meta.outputs.artifact_stem }}
        run: |
          $ErrorActionPreference = "Stop"
          $artifactStem = $env:ARTIFACT_STEM
          $archivePath = Join-Path "dist" "$artifactStem.zip"
          $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("xic-delivered-smoke-" + [guid]::NewGuid().ToString("N"))
          Expand-Archive -LiteralPath $archivePath -DestinationPath $smokeRoot
          $exe = Join-Path $smokeRoot "$artifactStem/XIC_Extractor.exe"
          $reportPath = Join-Path $smokeRoot "smoke.json"
          $process = Start-Process -FilePath $exe -ArgumentList @("--smoke-test", "`"$reportPath`"") -WorkingDirectory $smokeRoot -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw "Delivered archive smoke timed out: $reportPath"
          }
          if ($process.ExitCode -ne 0) {
            throw "Delivered archive smoke failed (exit $($process.ExitCode)): $reportPath"
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.status -ne "passed" -or -not $report.frozen -or -not $report.server_started -or -not $report.preset_roundtrip) {
            throw "Delivered archive smoke did not complete: $reportPath"
          }
          if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash -ne $archiveHash) {
            throw "Delivered archive changed after verification"
          }
          Write-Host "Verified delivered archive SHA256 $archiveHash; report: $reportPath"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_stem }}
          path: dist/${{ steps.meta.outputs.artifact_stem }}.zip
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.meta.outputs.artifact_stem }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
