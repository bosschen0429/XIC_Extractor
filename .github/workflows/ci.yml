name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main", "integration/**"]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: install
        run: uv sync --locked --all-extras --dev
      - run: uv run ruff check xic_extractor xic_inspector xic_workbench scripts tools tests
      - run: uv run ruff format --check xic_extractor xic_inspector xic_workbench scripts tools tests
      - name: Internal-defense growth gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          ARCHITECTURE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run python scripts/check_architecture_census.py --internal-defense-base "$ARCHITECTURE_BASE"
      - name: Static dependency contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run lint-imports --no-cache
      - name: Architecture census
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pytest tests/test_docs_architecture_census.py -m current_repository_census --noconftest -o addopts= --basetemp=${{ runner.temp }}/xic-architecture-census -q
      - name: Diagnostics index in sync
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run python scripts/check_diagnostics_index.py
      - name: Docs lifecycle audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run python tools/diagnostics/docs_management_audit.py --repo-only --json

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --dev
      - run: uv run mypy xic_extractor

  test:
    name: test (Python 3.12)
    # Keep post-merge work off the PR runner. Label an independent PR to use
    # hosted capacity too; this is explicit routing, not an idle-runner probe.
    runs-on: ${{ (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci:hosted-windows')) && 'windows-latest' || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: repo-3.12-tests
          submodules: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          working-directory: repo-3.12-tests
      - name: Install
        shell: pwsh
        working-directory: repo-3.12-tests
        run: |
          $started = Get-Date
          uv sync --locked --extra dev --group dev --python 3.12
          $exitCode = $LASTEXITCODE
          $elapsed = [math]::Round(((Get-Date) - $started).TotalSeconds, 1)
          "### Python 3.12 timing" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- runner_environment=$env:RUNNER_ENVIRONMENT" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- install_seconds=$elapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $exitCode
      - name: Test
        shell: pwsh
        working-directory: repo-3.12-tests
        env:
          XIC_PLAYWRIGHT_CHANNEL: ""
          # xdist owns parallelism; native BLAS pools must not multiply its
          # worker budget and starve browser actions or subprocess deadlines.
          OPENBLAS_NUM_THREADS: "1"
          # Runner VMs stall for several seconds; browser deadlines are hang
          # watchdogs, so CI widens all of them by one factor.
          XIC_BROWSER_DEADLINE_SCALE: "3"
        run: |
          $venvScripts = (Resolve-Path .\.venv\Scripts).Path
          $env:PATH = "$venvScripts;$env:PATH"
          $markerExpression = "not ledger_snapshot and not current_repository_census and not serial_ci"
          $runPackagingBuild = $true
          # An empty target list runs every test; a selected subset passes paths.
          $testTargets = @()
          $selectedSubset = $false
          if ("${{ github.event_name }}" -eq "pull_request") {
            $baseSha = "${{ github.event.pull_request.base.sha }}"
            $headSha = "${{ github.event.pull_request.head.sha }}"
            # tools.testing.test_selection owns which tests and gated markers this change needs.
            $plan = @(& .\.venv\Scripts\python.exe -m tools.testing.test_selection --ci-plan --base $baseSha --head $headSha)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $markerExpression = $plan[0]
            $selectedFiles = @($plan | Select-Object -Skip 1)
            if ($selectedFiles -notcontains 'ALL') {
              $testTargets = $selectedFiles
              $selectedSubset = $true
            }
            $runPackagingBuild = $markerExpression -notmatch 'not packaging_build'
          }
          $selectionSummary = if ($selectedSubset) { $testTargets.Count } else { 'all' }
          "- selected_test_files=$selectionSummary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $runSelected = -not $selectedSubset -or $testTargets.Count -gt 0
          $started = Get-Date
          $runBrowser = $runSelected -and $markerExpression -notmatch 'not browser_e2e'
          if ($runBrowser) {
            $browserStarted = Get-Date
            & .\.venv\Scripts\python.exe -m playwright install chromium
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $browserElapsed = [math]::Round(((Get-Date) - $browserStarted).TotalSeconds, 1)
            "- browser_install_seconds=$browserElapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          $parallelStarted = Get-Date
          $parallelMarkers = "($markerExpression) and not browser_e2e"
          $parallelExitCode = 0
          if ($runSelected) {
            & .\.venv\Scripts\python.exe -m pytest -m $parallelMarkers -n 4 --dist loadfile -v --tb=short --durations=10 @testTargets
            $parallelExitCode = $LASTEXITCODE
            # Exit 5: the selected files hold no test these markers keep.
            if ($selectedSubset -and $parallelExitCode -eq 5) { $parallelExitCode = 0 }
          }
          $parallelElapsed = [math]::Round(((Get-Date) - $parallelStarted).TotalSeconds, 1)
          "- marker_expression=$markerExpression" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- parallel_test_seconds=$parallelElapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          # Browser deadlines cover Chromium plus its in-process HTTP server.
          # Give them a fresh process without competing scientific-test workers.
          $browserStarted = Get-Date
          $browserExitCode = 0
          if ($runBrowser) {
            $browserMarkers = "($markerExpression) and browser_e2e"
            & .\.venv\Scripts\python.exe -m pytest -m $browserMarkers -n 0 -v --tb=short --durations=10 @testTargets
            $browserExitCode = $LASTEXITCODE
            if ($selectedSubset -and $browserExitCode -eq 5) { $browserExitCode = 0 }
          }
          $browserElapsed = [math]::Round(((Get-Date) - $browserStarted).TotalSeconds, 1)
          "- browser_test_seconds=$browserElapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          $serialTargets = @()
          if ($runPackagingBuild) {
            $serialTargets += "tests/test_pyinstaller_spec.py::test_built_wheel_contains_workbench_and_matching_target_template"
            $serialTargets += "tests/test_pyinstaller_spec.py::test_final_pyinstaller_archive_runs_html_workbench_smoke"
            $serialTargets += "tests/test_pyinstaller_spec.py::test_built_wheel_exposes_public_cid_nl_activation_surface"
          }
          $serialStarted = Get-Date
          $serialExitCode = 0
          if ($serialTargets.Count -gt 0) {
            & .\.venv\Scripts\python.exe -m pytest @serialTargets -v --tb=short --durations=10
            $serialExitCode = $LASTEXITCODE
          }
          $serialElapsed = [math]::Round(((Get-Date) - $serialStarted).TotalSeconds, 1)
          $elapsed = [math]::Round(((Get-Date) - $started).TotalSeconds, 1)
          "- serial_test_seconds=$serialElapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- test_seconds=$elapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($parallelExitCode -ne 0) { exit $parallelExitCode }
          if ($browserExitCode -ne 0) { exit $browserExitCode }
          exit $serialExitCode
      - name: Runner load on failure
        # Name the processes and socket states behind a machine stall.
        if: failure()
        shell: pwsh
        run: |
          Get-Process | Sort-Object CPU -Descending | Select-Object -First 15 Name, Id, CPU, WorkingSet64 | Format-Table -AutoSize
          Get-NetTCPConnection | Group-Object State | Select-Object Name, Count | Format-Table -AutoSize
      - name: Browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-browser-traces
          path: repo-3.12-tests/tmp_runtime/**/browser-trace.zip
          if-no-files-found: ignore
          retention-days: 7
