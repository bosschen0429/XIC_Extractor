name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - id: install
        run: uv sync --locked --all-extras --dev
      - run: uv run ruff check xic_extractor xic_inspector xic_workbench scripts tools tests
      - run: uv run ruff format --check xic_extractor xic_inspector xic_workbench scripts tools tests
      - name: Reject new source comments
        env:
          COMMENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run python scripts/check_comments.py --base "$COMMENT_BASE"
      - name: Internal-defense growth gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          ARCHITECTURE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run python scripts/check_architecture_census.py --internal-defense-base "$ARCHITECTURE_BASE"
      - name: Static dependency contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run lint-imports --no-cache
      - name: Architecture census
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pytest tests/test_docs_architecture_census.py -m current_repository_census --noconftest --basetemp=${{ runner.temp }}/xic-architecture-census -q
      - name: Diagnostics index in sync
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run python scripts/check_diagnostics_index.py
      - name: Repository docs links
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run python scripts/check_repository_docs.py

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
      browser_required: ${{ steps.coverage.outputs.browser_required }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.13.7"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --extra dev --group dev --python 3.15
      - name: Plan test coverage
        id: coverage
        shell: pwsh
        env:
          XIC_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          XIC_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          XIC_CI_EVENT: ${{ github.event_name }}
        run: |
          $coverageJson = uv run --no-sync python -m tools.testing.test_selection --ci-plan --base $env:XIC_CI_BASE --head $env:XIC_CI_HEAD --ci-event $env:XIC_CI_EVENT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $coverage = $coverageJson | ConvertFrom-Json
          $browserRequired = $null -ne $coverage.browser
          "coverage=$coverageJson" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "browser_required=$($browserRequired.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "- marker_expression=$($coverage.tests.marker_expression)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (-not $browserRequired) {
            "- browser_tests=NOT RUN (not relevant to this change)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Write-Output '::notice title=Browser tests not run::Not relevant to this change; no browser VM is allocated.'
          }

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - run: uv sync --locked --all-extras --dev
      - run: uv run mypy xic_extractor scripts xic_workbench xic_inspector tools

  windows-integration:
    needs: plan
    name: Windows integration (3.15)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: repo-3.15-tests
          submodules: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.13.7"
          python-version: "3.15"
          working-directory: repo-3.15-tests
      - name: Install
        shell: pwsh
        working-directory: repo-3.15-tests
        run: |
          $started = Get-Date
          uv sync --locked --extra dev --group dev --python 3.15
          $exitCode = $LASTEXITCODE
          $elapsed = [math]::Round(((Get-Date) - $started).TotalSeconds, 1)
          "### Python 3.15 timing" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- runner_environment=$env:RUNNER_ENVIRONMENT" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- install_seconds=$elapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $exitCode
      - name: Test
        shell: pwsh
        working-directory: repo-3.15-tests
        env:
          OPENBLAS_NUM_THREADS: "1"
          XIC_CI_PLAN: ${{ needs.plan.outputs.coverage }}
        run: |
          $venvScripts = (Resolve-Path .\.venv\Scripts).Path
          $env:PATH = "$venvScripts;$env:PATH"
          $coverage = $env:XIC_CI_PLAN | ConvertFrom-Json
          $markerExpression = $coverage.tests.marker_expression
          $runPackagingBuild = $markerExpression -notmatch 'not packaging_build'
          $testTargets = @()
          $selectedSubset = $null -ne $coverage.tests.files
          if ($selectedSubset) {
            $testTargets = @($coverage.tests.files)
          }
          $selectionSummary = if ($selectedSubset) { $testTargets.Count } else { 'all' }
          "- selected_test_files=$selectionSummary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $runSelected = -not $selectedSubset -or $testTargets.Count -gt 0
          $started = Get-Date
          $windowsStarted = Get-Date
          $windowsMarkers = "($markerExpression) and windows_only and not browser_e2e"
          $windowsExitCode = 0
          if ($runSelected) {
            & .\.venv\Scripts\python.exe -m pytest -m $windowsMarkers -n 0 -v --tb=short --durations=10 @testTargets
            $windowsExitCode = $LASTEXITCODE
            if ($selectedSubset -and $windowsExitCode -eq 5) { $windowsExitCode = 0 }
          }
          $windowsElapsed = [math]::Round(((Get-Date) - $windowsStarted).TotalSeconds, 1)
          "- marker_expression=$markerExpression" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- windows_test_seconds=$windowsElapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          $serialTargets = @()
          if ($runPackagingBuild) {
            $serialTargets += "tests/test_pyinstaller_spec.py::test_built_wheel_contains_workbench_and_matching_target_template"
            $serialTargets += "tests/test_pyinstaller_spec.py::test_final_pyinstaller_archive_runs_html_workbench_smoke"
            $serialTargets += "tests/test_pyinstaller_spec.py::test_built_wheel_exposes_public_cid_nl_activation_surface"
          }
          $serialStarted = Get-Date
          $serialExitCode = 0
          if ($serialTargets.Count -gt 0) {
            & .\.venv\Scripts\python.exe -m pytest @serialTargets -v --tb=short --durations=10
            $serialExitCode = $LASTEXITCODE
          }
          $serialElapsed = [math]::Round(((Get-Date) - $serialStarted).TotalSeconds, 1)
          $elapsed = [math]::Round(((Get-Date) - $started).TotalSeconds, 1)
          "- serial_test_seconds=$serialElapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- test_seconds=$elapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($windowsExitCode -ne 0) { exit $windowsExitCode }
          exit $serialExitCode
      - name: Runner load on failure
        if: failure()
        shell: pwsh
        run: |
          Get-Process | Sort-Object CPU -Descending | Select-Object -First 15 Name, Id, CPU, WorkingSet64 | Format-Table -AutoSize
          Get-NetTCPConnection | Group-Object State | Select-Object Name, Count | Format-Table -AutoSize

  python-tests:
    needs: plan
    name: Python tests (3.15, Linux, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      PYTHONNET_RUNTIME: coreclr
      XIC_CI_PLAN: ${{ needs.plan.outputs.coverage }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.13.7"
          python-version: "3.15"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
          check-latest: false
          skip-lts-prepass: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --group dev --python 3.15
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test
        shell: pwsh
        run: |
          $coverage = $env:XIC_CI_PLAN | ConvertFrom-Json
          $markerExpression = $coverage.tests.marker_expression
          $testTargets = @()
          $selectedSubset = $null -ne $coverage.tests.files
          if ($selectedSubset) {
            $testTargets = @($coverage.tests.files)
          }
          $selectionSummary = if ($selectedSubset) { $testTargets.Count } else { 'all' }
          "- selected_test_files=$selectionSummary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $markers = "($markerExpression) and not windows_only and not browser_e2e"
          "- marker_expression=$markers" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($selectedSubset -and $testTargets.Count -eq 0) {
            Write-Output '::notice title=Python tests not run::No affected test files; this is not a passing test run.'
            exit 0
          }
          uv run --no-sync python -m pytest -p tools.testing.test_sharding --test-shard "${{ matrix.shard }}/${{ strategy.job-total }}" -m $markers -n 4 --dist worksteal -q --tb=short --durations=10 @testTargets
          $testExitCode = $LASTEXITCODE
          if ($selectedSubset -and $testExitCode -eq 5) {
            Write-Output '::notice title=Python tests not run::No selected tests belong to the Linux lane.'
            exit 0
          }
          exit $testExitCode

  browser:
    needs: plan
    if: ${{ needs.plan.outputs.browser_required == 'true' }}
    name: Browser (Windows Chromium, shard ${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: repo-3.15-browser
          submodules: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.13.7"
          python-version: "3.15"
          working-directory: repo-3.15-browser
      - name: Install
        shell: pwsh
        working-directory: repo-3.15-browser
        run: uv sync --locked --extra dev --group dev --python 3.15
      - name: Browser test
        shell: pwsh
        working-directory: repo-3.15-browser
        env:
          XIC_PLAYWRIGHT_CHANNEL: ""
          OPENBLAS_NUM_THREADS: "1"
          XIC_BROWSER_DEADLINE_SCALE: "3"
          XIC_CI_PLAN: ${{ needs.plan.outputs.coverage }}
        run: |
          $venvScripts = (Resolve-Path .\.venv\Scripts).Path
          $env:PATH = "$venvScripts;$env:PATH"
          $coverage = ($env:XIC_CI_PLAN | ConvertFrom-Json).browser
          $markerExpression = $coverage.marker_expression
          $testTargets = @($coverage.files)
          if ($testTargets.Count -eq 0) { throw 'Required browser coverage has no candidate files.' }
          $started = Get-Date
          & .\.venv\Scripts\python.exe -m playwright install --only-shell chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installElapsed = [math]::Round(((Get-Date) - $started).TotalSeconds, 1)
          "- browser_install_seconds=$installElapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $started = Get-Date
          $browserMarkers = "($markerExpression) and browser_e2e"
          & .\.venv\Scripts\python.exe -m pytest -p tools.testing.test_sharding --test-shard "${{ matrix.shard }}/${{ strategy.job-total }}" -m $browserMarkers -n 0 -v --tb=short --durations=10 @testTargets
          $browserExitCode = $LASTEXITCODE
          $elapsed = [math]::Round(((Get-Date) - $started).TotalSeconds, 1)
          "- browser_test_seconds=$elapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $browserExitCode
      - name: Runner load on failure
        if: failure()
        shell: pwsh
        run: |
          Get-Process | Sort-Object CPU -Descending | Select-Object -First 15 Name, Id, CPU, WorkingSet64 | Format-Table -AutoSize
          Get-NetTCPConnection | Group-Object State | Select-Object Name, Count | Format-Table -AutoSize
      - name: Browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-browser-traces-${{ matrix.shard }}
          path: |
            repo-3.15-browser/tmp_runtime/**/browser-trace.zip
            repo-3.15-browser/output/browser-failures/**/browser-trace.zip
            repo-3.15-browser/output/browser-failures/**/browser-events.json
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: test gate
    needs: [lint, plan, python-tests, windows-integration, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test lane
        shell: pwsh
        env:
          TEST_LANE_RESULTS: ${{ toJSON(needs) }}
        run: |
          $lanes = $env:TEST_LANE_RESULTS | ConvertFrom-Json
          foreach ($lane in $lanes.PSObject.Properties) {
            if ($lane.Name -eq 'browser' -and $lane.Value.result -eq 'skipped' -and
                $lanes.plan.result -eq 'success' -and
                $lanes.plan.outputs.browser_required -eq 'false') {
              continue
            }
            if ($lane.Value.result -ne 'success') {
              Write-Error "$($lane.Name): $($lane.Value.result)"
              exit 1
            }
          }

  legacy-test-context:
    name: test (Python 3.12)
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mirror test gate
        env:
          TEST_GATE_RESULT: ${{ needs.test.result }}
        run: test "$TEST_GATE_RESULT" = success
