name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - run: uv run ruff check xic_extractor tests
      - name: Static dependency contracts
        run: uv run lint-imports --no-cache
      - name: Architecture census
        run: uv run python scripts/check_architecture_census.py
      - name: Lane fixture boundary
        run: uv run python scripts/check_lane_fixture_boundary.py
      - name: Phase naming boundary
        run: uv run python scripts/check_phase_naming_boundary.py
      - name: Test shard coverage
        run: uv run python -m tools.testing.test_shards --check
      - name: Diagnostics index in sync
        run: uv run python scripts/check_diagnostics_index.py
      - name: Docs lifecycle audit
        run: uv run python tools/diagnostics/docs_management_audit.py --repo-only --fail-on-completed-transient --json

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - run: uv run mypy xic_extractor

  test:
    name: test (Python 3.12)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: repo-3.12-tests
          submodules: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          working-directory: repo-3.12-tests
      - name: Install
        shell: pwsh
        working-directory: repo-3.12-tests
        run: |
          $started = Get-Date
          uv sync --locked --extra dev --group dev --python 3.12
          $exitCode = $LASTEXITCODE
          $elapsed = [math]::Round(((Get-Date) - $started).TotalSeconds, 1)
          "### Python 3.12 timing" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- install_seconds=$elapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $exitCode
      - name: Test shards
        shell: pwsh
        working-directory: repo-3.12-tests
        run: |
          $venvScripts = (Resolve-Path .\.venv\Scripts).Path
          $env:PATH = "$venvScripts;$env:PATH"
          $shards = @(
            "docs-config",
            "gui",
            "targeted-core",
            "alignment-core",
            "product-gates-activation",
            "product-gates-evidence",
            "diagnostics-tools"
          )
          $failed = @()
          foreach ($shard in $shards) {
            $started = Get-Date
            & .\.venv\Scripts\python.exe -m tools.testing.test_shards $shard -- -v --tb=short -x
            $exitCode = $LASTEXITCODE
            $elapsed = [math]::Round(((Get-Date) - $started).TotalSeconds, 1)
            "- $shard test_seconds=$elapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            if ($exitCode -ne 0) { $failed += $shard }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed shards: $($failed -join ', ')"
            exit 1
          }

  compatibility:
    name: compatibility (Python 3.11)
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: repo-3.11-compatibility
          submodules: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.11"
          working-directory: repo-3.11-compatibility
      - name: Install
        shell: pwsh
        working-directory: repo-3.11-compatibility
        run: |
          $started = Get-Date
          uv sync --locked --extra dev --group dev --python 3.11
          $exitCode = $LASTEXITCODE
          $elapsed = [math]::Round(((Get-Date) - $started).TotalSeconds, 1)
          "### Python 3.11 timing" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- install_seconds=$elapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $exitCode
      - name: Test shards
        shell: pwsh
        working-directory: repo-3.11-compatibility
        run: |
          $venvScripts = (Resolve-Path .\.venv\Scripts).Path
          $env:PATH = "$venvScripts;$env:PATH"
          $shards = @(
            "docs-config",
            "gui",
            "targeted-core",
            "alignment-core",
            "product-gates-activation",
            "product-gates-evidence",
            "diagnostics-tools"
          )
          $failed = @()
          foreach ($shard in $shards) {
            $started = Get-Date
            & .\.venv\Scripts\python.exe -m tools.testing.test_shards $shard -- -v --tb=short -x
            $exitCode = $LASTEXITCODE
            $elapsed = [math]::Round(((Get-Date) - $started).TotalSeconds, 1)
            "- $shard test_seconds=$elapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            if ($exitCode -ne 0) { $failed += $shard }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed shards: $($failed -join ', ')"
            exit 1
          }
