name: Implementation Change
description: Describe what should work, the scope, and how completion is checked.
title: "[Implementation] "
labels:
  - needs-triage
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should work, and what it costs today that it does not.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: The behavior this changes. Add what is out of scope only when it would otherwise be ambiguous.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: The observable result and the check that decides completion. For science or long RAW runs, name the method's oracle and inputs.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional. Owners, consumers, migration, rollback or a stop condition when the change needs them.
    validations:
      required: false
