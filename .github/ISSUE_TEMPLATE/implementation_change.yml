name: Implementation Change
description: Define a bounded issue-to-PR implementation contract.
title: "[Implementation] "
labels:
  - needs-triage
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: >-
        Explain the direction and value separately from the executable
        acceptance contract below. State what should work and the current
        user, product, scientific, or engineering cost.
    validations:
      required: true
  - type: input
    id: execution_base
    attributes:
      label: Execution binding
      description: >-
        Enter the exact 40-character code-evidence commit after blockers close;
        otherwise enter `provisional - freeze at claim after #...`. A
        provisional issue is not ready-for-agent, and the claiming agent
        reconciles it automatically.
    validations:
      required: true
  - type: textarea
    id: graph_placement
    attributes:
      label: Delivery graph placement and handoff
      description: >-
        Name the parent MAP, real native blockers, typed predecessor outputs
        consumed, produced typed output and consuming contract or entry,
        successor handoff, and exactly one carrier issue per delivery edge; use
        `independent` when no edge exists.
    validations:
      required: true
  - type: textarea
    id: owner_universe
    attributes:
      label: Semantic owner and finite production universe
      description: Name one owner, the reachable production entries/current direct consumers, the census locator or query, and explicit exclusions.
    validations:
      required: true
  - type: textarea
    id: asset_disposition
    attributes:
      label: Owner-local asset disposition
      description: >-
        For migration or replacement, classify retained, adapted, replaced, and
        retirement-candidate paths with consumers, zero-reference evidence, and
        adapter removal conditions; otherwise state `Not applicable -
        established owner` and its locator.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope ceiling and non-goals
      description: >-
        Bound this ticket by behavior and owner; name explicit non-goals and the
        owner cutoff that prevents reachable future work from being absorbed
        here.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Executable acceptance contract
      description: >-
        Complete every exact declared field. Use `Not applicable - <reason>`
        only when failure, cancellation, or partial-write semantics genuinely
        do not apply. Extra prose cannot replace a field.
      value: |-
        - Actor:
        - Input:
        - Real entry path:
        - Observable:
        - Expected result:
        - Stable oracle:
        - Falsifying counterexample:
        - Failure semantics:
        - Cancellation semantics:
        - Partial-write semantics:
        - Preserved invariants:
        - Non-goals:
        - Rollback:
        - Close rule:
    validations:
      required: true
  - type: textarea
    id: atomic_delivery
    attributes:
      label: Atomic delivery boundary
      description: >-
        Default to one ticket and one Atomic PR. For a multi-PR plan, change
        Delivery plan to `independently-atomic-multi-pr` and repeat the exact
        Proposed PR unit block for every unit. Every unit must remain useful,
        reviewable, testable, mergeable, and reversible with no later sibling.
      value: |-
        - Delivery plan: one-ticket-one-atomic-pr

        #### Proposed PR unit: whole-ticket

        - Bounded outcome:
        - Current consumer:
        - Independently decisive oracle:
        - Independently useful: yes
        - Independently reviewable: yes
        - Independently testable: yes
        - Independently mergeable: yes
        - Independently reversible: yes
        - Later sibling required: no
        - Split rationale: not applicable - this one Atomic PR closes the ticket
        - Replaced surface disposition:
        - Rollback:
    validations:
      required: true
  - type: textarea
    id: stop_rule
    attributes:
      label: Local resolution and parent escalation
      description: >-
        Main adjudicates every finding. State the ticket-local fix, fail-closed
        result, or bounded probe. Escalate only a current constructible
        contradiction that changes a semantic owner, public contract,
        transaction boundary, or parent acceptance and whose reachable wrong
        output cannot close ticket-locally without that change; otherwise Main
        routes or rejects the finding.
    validations:
      required: true
