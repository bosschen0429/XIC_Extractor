name: Implementation Change
description: Define a bounded issue-to-PR implementation contract.
title: "[Implementation] "
labels:
  - needs-triage
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and observable loss
      description: State what should work and the current user, product, scientific, or engineering cost.
    validations:
      required: true
  - type: input
    id: execution_base
    attributes:
      label: Execution binding
      description: >-
        Enter the exact 40-character code-evidence commit after blockers close;
        otherwise enter `provisional - freeze at claim after #...`. A
        provisional issue is not ready-for-agent, and the claiming agent
        reconciles it automatically.
    validations:
      required: true
  - type: textarea
    id: graph_placement
    attributes:
      label: Delivery graph placement and handoff
      description: >-
        Name the parent MAP, real native blockers, typed predecessor outputs
        consumed, produced typed output and consuming contract or entry,
        successor handoff, and exactly one carrier issue per delivery edge; use
        `independent` when no edge exists.
    validations:
      required: true
  - type: textarea
    id: owner_universe
    attributes:
      label: Semantic owner and finite production universe
      description: Name one owner, the reachable production entries/current direct consumers, the census locator or query, and explicit exclusions.
    validations:
      required: true
  - type: textarea
    id: asset_disposition
    attributes:
      label: Owner-local asset disposition
      description: >-
        For migration or replacement, classify retained, adapted, replaced, and
        retirement-candidate paths with consumers, zero-reference evidence, and
        adapter removal conditions; otherwise state `Not applicable -
        established owner` and its locator.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope ceiling and non-goals
      description: >-
        Bound this ticket by behavior and owner; name explicit non-goals and the
        owner cutoff that prevents reachable future work from being absorbed
        here.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Ticket completion contract
      description: >-
        State the required ticket-local observable or usable handoff, current
        entry or consumer, stable falsifier, preserved invariants, work not
        required for closure, and the rule to close or hand off when every item
        passes. Explain what makes the delivery Atomic: a current consumer can
        use the outcome now, the evidence is independently decisive, and the
        change can be reviewed and rolled back without a future sibling. If
        multiple PRs are proposed, name the outcome or failure-domain seam
        rather than size or construction stage. Answer in prose appropriate to
        this issue; no extra fixed subfields are required.
    validations:
      required: true
  - type: textarea
    id: stop_rule
    attributes:
      label: Local resolution and parent escalation
      description: >-
        Main adjudicates every finding. State the ticket-local fix, fail-closed
        result, or bounded probe. Escalate only a current constructible
        contradiction that changes a semantic owner, public contract,
        transaction boundary, or parent acceptance and whose reachable wrong
        output cannot close ticket-locally without that change; otherwise Main
        routes or rejects the finding.
    validations:
      required: true
