<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分組原型檢視器</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#e3e6eb; --line-soft:#eef0f3;
  --text:#1c2330; --muted:#647084; --faint:#9aa3b2;
  --accent:#2f5bea; --accent-soft:#ebf0ff; --warn:#f0a020;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.5 "Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:28px;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand h1{font-size:16px;margin:0;font-weight:700}
.brand h1 span{font-weight:400;color:var(--muted)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.stats{display:flex;margin-left:auto}
.stat{padding:2px 16px;border-left:1px solid var(--line)}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{color:var(--muted);font-size:11.5px;white-space:nowrap}
main{flex:1;display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}

aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.tools{padding:14px 14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg)}
.search:focus{outline:none;border-color:var(--accent);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:2px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:#c9ced8}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}
.sortrow{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}
.sortrow select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:#fff;color:var(--text)}
.list{overflow:auto;flex:1}
.item{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 10px;padding:9px 14px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.item:hover{background:#f8f9fb}
.item.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.item .mz{font-weight:650;font-variant-numeric:tabular-nums}
.item .pct{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
.item .meta{grid-column:1/-1;color:var(--muted);font-size:12px}
.bar{grid-column:1/-1;height:3px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--warn)}
.tag{display:inline-block;font-size:11px;line-height:17px;padding:0 6px;border-radius:4px;background:var(--line-soft);color:var(--muted);margin-left:6px;font-weight:400;vertical-align:1px}
.tag.hard{background:#fff3e0;color:#a85a00}
.tag.slow{background:#fdecec;color:#b42318}
.tag.anchor{background:#eef3ff;color:#2446c4}
.empty{padding:24px 14px;color:var(--faint);text-align:center}

.view{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 18px 12px;gap:12px}
.vhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.vtitle{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.vsub{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--line-soft);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.14)}
.seg button small{color:var(--faint);margin-left:5px;font-size:11.5px}
.toggles{display:flex;gap:14px}
.toggle{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);margin:0}
.content{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;min-height:0}
.plot{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-height:0;overflow:hidden}
.plot canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.plot canvas.drag{cursor:grabbing}
.tip{position:absolute;pointer-events:none;background:rgba(20,26,38,.95);color:#e5e7eb;font-size:12px;line-height:1.6;padding:8px 11px;border-radius:8px;white-space:nowrap;display:none;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tip b{color:#fff}
.tip .k{color:#9aa3b2}
.tip .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.tip .df{color:#fbbf24}
.zoomhint{position:absolute;right:12px;top:8px;font-size:11.5px;color:var(--faint);pointer-events:none}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0}
.legend h3{margin:0;padding:12px 14px 6px;font-size:13px}
.legend .note{padding:0 14px 6px;color:var(--muted);font-size:12px}
.legend .rows{overflow:auto;padding:0 8px 8px;flex:1}
.lrow{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;font-size:12.5px;cursor:pointer}
.lrow:hover,.lrow.hi{background:var(--bg)}
.lrow .sw{width:11px;height:11px;border-radius:50%}
.lrow .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.keys{padding:10px 14px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.9}
kbd{display:inline-block;min-width:17px;padding:0 4px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:#fff;
  font:11px/15px ui-monospace,Consolas,monospace;color:var(--text);text-align:center;margin-right:2px}
.foot{color:var(--faint);font-size:11.5px;display:flex;justify-content:space-between;gap:16px}
.mk{display:inline-block;width:9px;height:9px;border-radius:50%;background:#56627a;vertical-align:-1px}
.mk.small{width:5px;height:5px;vertical-align:1px}
.mk.ring{background:none;border:1.5px solid #8a94a6}
.mk.diff{background:none;border:2px solid #111;width:12px;height:12px;vertical-align:-2px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>分組原型檢視器 <span>· 照疊圖找帶（互補版）</span></h1>
    <p>同一個 m/z 在 85 針的訊號按針序排開，比較三種分組。用完即丟的原型，不是正式程式。</p>
  </div>
  <div class="stats">
    <div class="stat"><b>910</b><span>≥2 支直接峰的窗口</span></div>
    <div class="stat"><b>51%</b><span>與不啟用漂移帶完全相同</span></div>
    <div class="stat"><b>9.0%</b><span>直接峰放法不同</span></div>
    <div class="stat"><b>0.25 秒</b><span>整批連帶（現行重播約 500 秒）</span></div>
  </div>
</header>
<main>
  <aside>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="搜尋 m/z，例如 334.05" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div class="sortrow"><span id="count"></span>
        <label>排序 <select id="sort">
          <option value="diff">差異比例</option><option value="mz">m/z</option><option value="nd">直接峰數</option>
        </select></label>
      </div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <section class="view">
    <div class="vhead">
      <div><div class="vtitle" id="title"></div><div class="vsub" id="subtitle"></div></div>
      <div class="spacer"></div>
      <div class="seg" id="seg"></div>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="onlyDiff"> 只看差異</label>
        <label class="toggle"><input type="checkbox" id="showLoose"> 沒成列的 MS1-only</label>
      </div>
    </div>
    <div class="content">
      <div class="plot" id="plot">
        <canvas id="cv"></canvas>
        <div class="tip" id="tip"></div>
      </div>
      <div class="legend">
        <h3 id="lgTitle"></h3>
        <div class="note" id="lgNote"></div>
        <div class="rows" id="lgRows"></div>
        <div class="keys">
          <div><span class="mk"></span> 直接峰　<span class="mk small"></span> MS1-only　<span class="mk ring"></span> 沒成列</div>
          <div><span class="mk diff"></span> 跟「不啟用漂移帶」分法不同</div>
          <div style="margin-top:4px"><kbd>↑</kbd><kbd>↓</kbd>換窗口　<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>換分組</div>
          <div><kbd>D</kbd>只看差異　<kbd>M</kbd>沒成列 MS1　<kbd>R</kbd>復原</div>
        </div>
      </div>
    </div>
    <div class="foot"><span>灰階＝每針 XIC（±10 ppm）各自除以最大值後開根號，越深訊號越強。同色＝三種分組裡重疊最多的同一列。差異之處沒有標準答案，請以疊圖判斷。</span><span>滾輪縮放 RT · 拖曳平移 · 雙擊復原</span></div>
  </section>
</main>
<script>
const DATA = /*__DATA__*/null;
const GROUPS = ["原型（互補版）", "不啟用漂移帶", "PR 現在（漂移帶 21）"];
const SHORT = ["原型", "不啟用漂移帶", "PR 現在"];
const PALETTE = ["#2f5bea", "#e0464e", "#1f9d55", "#8b5cf6", "#f08c00", "#0ea5b7", "#c2410c", "#db2777", "#4d7c0f", "#64748b"];
const FILTERS = [["all", "全部"], ["watched", "看過的 4 個"], ["一般窗口", "一般"], ["難窗口", "難窗口"], ["最慢窗口", "最慢"], ["anchored", "有錨點"]];
const N = DATA.samples.length;
const state = { filter: "all", q: "", sort: "diff", id: null, g: 0, onlyDiff: false, showLoose: false, zoom: null, hiRow: null };
const $ = id => document.getElementById(id);
const byId = new Map(DATA.windows.map(w => [w.id, w]));
const images = new Map();
let hits = [], order = [];

const share = w => (w.nd ? w.moved[0] / w.nd : 0);
const colour = c => PALETTE[c % PALETTE.length];
const current = () => byId.get(state.id);

function visible() {
  let ws = DATA.windows.filter(w =>
    state.filter === "all" ? true :
    state.filter === "watched" ? w.watched :
    state.filter === "anchored" ? w.anchored : w.kind === state.filter);
  const q = state.q.trim();
  if (q) ws = ws.filter(w => String(w.mz).includes(q));
  const sorters = { diff: (a, b) => share(b) - share(a) || a.mz - b.mz, mz: (a, b) => a.mz - b.mz, nd: (a, b) => b.nd - a.nd };
  return ws.sort(sorters[state.sort]);
}

function tags(w) {
  let t = "";
  if (w.kind === "難窗口") t += '<span class="tag hard">難窗口</span>';
  if (w.kind === "最慢窗口") t += '<span class="tag slow">最慢</span>';
  if (w.anchored) t += '<span class="tag anchor">有錨點</span>';
  return t;
}

function renderChips() {
  $("chips").innerHTML = FILTERS.map(([k, label]) =>
    `<button class="chip${state.filter === k ? " on" : ""}" data-k="${k}">${label}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { state.filter = b.dataset.k; renderChips(); renderList(true); });
}

function renderList(keepOrSelectFirst) {
  order = visible();
  $("count").textContent = `${order.length} 個窗口`;
  if (!order.length) { $("list").innerHTML = '<div class="empty">沒有符合的窗口</div>'; return; }
  $("list").innerHTML = order.map(w => {
    const pct = Math.round(100 * share(w));
    return `<div class="item${w.id === state.id ? " on" : ""}" data-id="${w.id}">
      <div class="mz">${w.mz.toFixed(4)}${tags(w)}</div><div class="pct" title="原型與不啟用漂移帶分法不同的直接峰比例">差異 ${pct}%</div>
      <div class="meta">直接峰 ${w.nd} · MS1-only ${w.nm}</div>
      <div class="meta">列數：原型 ${w.rows[0]} · 無帶 ${w.rows[1]} · PR ${w.rows[2]}</div>
      <div class="bar"><i style="width:${Math.min(100, pct)}%"></i></div></div>`;
  }).join("");
  $("list").querySelectorAll(".item").forEach(el => el.onclick = () => select(+el.dataset.id));
  if (keepOrSelectFirst && !order.some(w => w.id === state.id)) select(order[0].id);
}

function renderSeg() {
  const w = current();
  $("seg").innerHTML = GROUPS.map((name, g) =>
    `<button class="${g === state.g ? "on" : ""}" data-g="${g}" title="${name}">${SHORT[g]}<small>${w ? w.rows[g] + " 列" : ""}</small></button>`).join("");
  $("seg").querySelectorAll("button").forEach(b => b.onclick = () => setGroup(+b.dataset.g));
}

function renderHead() {
  const w = current();
  $("title").innerHTML = `m/z ${w.mz.toFixed(4)}${tags(w)}`;
  const pct = Math.round(100 * share(w));
  $("subtitle").textContent = `直接峰 ${w.nd} · MS1-only ${w.nm} · 原型與不啟用漂移帶分法不同 ${w.moved[0]} 支直接峰（${pct}%）· PR 現在與不啟用漂移帶不同 ${w.moved[2]} 支`;
}

function renderLegend() {
  const w = current(), g = state.g;
  const rows = new Map();
  let looseD = 0, looseM = 0;
  w.row[g].forEach((b, i) => {
    if (b < 0) { w.d[i] ? looseD++ : looseM++; return; }
    if (!rows.has(b)) rows.set(b, { d: 0, m: 0, c: w.col[g][i] });
    w.d[i] ? rows.get(b).d++ : rows.get(b).m++;
  });
  $("lgTitle").textContent = `${GROUPS[g]}：${rows.size} 列`;
  $("lgNote").textContent = `沒成列：直接峰 ${looseD}、MS1-only ${looseM}`;
  $("lgRows").innerHTML = [...rows.entries()].sort((a, b) => a[0] - b[0]).map(([b, r]) =>
    `<div class="lrow${state.hiRow === b ? " hi" : ""}" data-b="${b}"><span class="sw" style="background:${colour(r.c)}"></span>
      <span>列 ${b + 1}</span><span class="n">直接 ${r.d}${r.m ? ` · MS1 ${r.m}` : ""}</span></div>`).join("") ||
    '<div class="empty">這種分組在此窗口沒有成列</div>';
  $("lgRows").querySelectorAll(".lrow").forEach(el => {
    el.onmouseenter = () => { state.hiRow = +el.dataset.b; draw(); };
    el.onmouseleave = () => { state.hiRow = null; draw(); };
  });
}

function select(id) {
  $("tip").style.display = "none";
  state.id = id; state.zoom = null; state.hiRow = null;
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("on", +el.dataset.id === id));
  const el = document.querySelector(`.item[data-id="${id}"]`);
  if (el) el.scrollIntoView({ block: "nearest" });
  renderHead(); renderSeg(); renderLegend(); draw();
}

function setGroup(g) { state.g = g; state.hiRow = null; renderSeg(); renderLegend(); draw(); }

function image(w) {
  if (images.has(w.id)) return images.get(w.id);
  const G = DATA.grid, raw = atob(w.img);
  const off = document.createElement("canvas");
  off.width = G; off.height = N;
  const ctx = off.getContext("2d"), im = ctx.createImageData(G, N);
  for (let s = 0; s < N; s++) {
    for (let x = 0; x < G; x++) {
      const v = raw.charCodeAt(s * G + x) / 255, o = ((N - 1 - s) * G + x) * 4;
      im.data[o] = 255 - 221 * v; im.data[o + 1] = 255 - 210 * v; im.data[o + 2] = 255 - 190 * v; im.data[o + 3] = 255;
    }
  }
  ctx.putImageData(im, 0, 0);
  images.set(w.id, off);
  return off;
}

function niceStep(span, target) {
  const raw = span / target, p = Math.pow(10, Math.floor(Math.log10(raw)));
  return [1, 2, 2.5, 5, 10].map(k => k * p).find(s => s >= raw) || 10 * p;
}

const M = { l: 58, r: 14, t: 14, b: 40 };
function geometry() {
  const plot = $("plot"), W = plot.clientWidth, H = plot.clientHeight;
  return { W, H, pw: W - M.l - M.r, ph: H - M.t - M.b };
}

function draw() {
  const w = current(); if (!w) return;
  const cv = $("cv"), dpr = window.devicePixelRatio || 1, { W, H, pw, ph } = geometry();
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const [z0, z1] = state.zoom || [w.lo, w.hi], G = DATA.grid;
  const sx = (z0 - w.lo) / (w.hi - w.lo) * G, sw = (z1 - z0) / (w.hi - w.lo) * G;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(image(w), sx, 0, sw, N, M.l, M.t, pw, ph);
  ctx.strokeStyle = "#d5d9e0"; ctx.lineWidth = 1; ctx.strokeRect(M.l + .5, M.t + .5, pw - 1, ph - 1);

  ctx.fillStyle = "#647084"; ctx.font = '11.5px "Microsoft JhengHei UI","Microsoft JhengHei",system-ui';
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  const step = niceStep(z1 - z0, Math.max(4, Math.floor(pw / 110)));
  for (let t = Math.ceil(z0 / step) * step; t <= z1 + 1e-9; t += step) {
    const x = M.l + (t - z0) / (z1 - z0) * pw;
    ctx.fillRect(x, M.t + ph, 1, 4);
    ctx.fillText(t.toFixed(step < 0.1 ? 2 : step < 1 ? 1 : 0), x, M.t + ph + 7);
  }
  ctx.fillText("RT（分鐘，原始）", M.l + pw / 2, M.t + ph + 23);
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let s = 0; s < N; s += 10) {
    const y = M.t + ph - (s + 0.5) * ph / N;
    ctx.fillRect(M.l - 4, y, 4, 1);
    ctx.fillText(`第 ${DATA.orders[s]} 針`, M.l - 7, y);
  }

  const g = state.g, X = t => M.l + (t - z0) / (z1 - z0) * pw, Y = s => M.t + ph - (s + 0.5) * ph / N;
  hits = [];
  const idx = [...w.t.keys()].sort((a, b) => w.d[a] - w.d[b]);
  for (const i of idx) {
    if (!w.d[i] && w.row[g][i] < 0 && !state.showLoose) continue;
    const x = X(w.t[i]); if (x < M.l - 2 || x > M.l + pw + 2) continue;
    const y = Y(w.r[i]), b = w.row[g][i], diff = g !== 1 && w.diff[g][i];
    let alpha = 1;
    if (state.hiRow !== null && b !== state.hiRow) alpha = 0.12;
    if (state.onlyDiff && g !== 1 && !diff) alpha = Math.min(alpha, 0.12);
    ctx.globalAlpha = alpha;
    const r = w.d[i] ? 4 : 2.3;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI);
    if (b >= 0) {
      ctx.fillStyle = colour(w.col[g][i]); ctx.fill();
      if (w.d[i]) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke(); }
    } else {
      ctx.strokeStyle = "#7c8799"; ctx.lineWidth = 1.4; ctx.stroke();
    }
    if (diff) { ctx.beginPath(); ctx.arc(x, y, r + 2.6, 0, 2 * Math.PI); ctx.strokeStyle = "#111"; ctx.lineWidth = 1.6; ctx.stroke(); }
    ctx.globalAlpha = 1;
    if (alpha === 1) hits.push({ x, y, i });
  }
}

function rowText(w, g, i) {
  const b = w.row[g][i];
  if (b < 0) return '<span class="k">沒成列</span>';
  return `<span class="sw" style="background:${colour(w.col[g][i])}"></span>列 ${b + 1}`;
}

function showTip(e) {
  const w = current(); if (!w) return;
  const rect = $("plot").getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let best = null, bd = 81;
  for (const h of hits) { const d = (h.x - mx) ** 2 + (h.y - my) ** 2; if (d < bd) { bd = d; best = h; } }
  const tip = $("tip");
  if (!best) { tip.style.display = "none"; return; }
  const i = best.i;
  tip.innerHTML = `<b>${DATA.samples[w.r[i]]}</b> <span class="k">第 ${DATA.orders[w.r[i]]} 針</span><br>
    RT <b>${w.t[i].toFixed(3)}</b> 分 · m/z ${w.z[i].toFixed(4)} · ${w.d[i] ? "直接峰" : "MS1-only"}<br>
    ${[0, 1, 2].map(g => `<span class="k">${SHORT[g]}：</span>${rowText(w, g, i)}${g !== 1 && w.diff[g][i] ? ' <span class="df">分法不同</span>' : ""}`).join("<br>")}`;
  tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(mx + 14, rect.width - tw - 8) + "px";
  tip.style.top = Math.min(my + 14, rect.height - th - 8) + "px";
}

function rtAt(mx) {
  const w = current(), { pw } = geometry(), [z0, z1] = state.zoom || [w.lo, w.hi];
  return z0 + (mx - M.l) / pw * (z1 - z0);
}

function setZoom(z0, z1) {
  const w = current(), span = w.hi - w.lo, s = Math.min(span, Math.max(0.1, z1 - z0));
  let a = Math.max(w.lo, Math.min(z0, w.hi - s));
  state.zoom = s >= span - 1e-9 ? null : [a, a + s];
  draw();
}

const cv = $("cv");
let drag = null;
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const w = current(), [z0, z1] = state.zoom || [w.lo, w.hi];
  const t = rtAt(e.offsetX), f = e.deltaY > 0 ? 1.25 : 0.8, s = (z1 - z0) * f;
  setZoom(t - (t - z0) * f, t - (t - z0) * f + s);
}, { passive: false });
cv.addEventListener("mousedown", e => { const w = current(); drag = { x: e.clientX, z: state.zoom || [w.lo, w.hi] }; cv.classList.add("drag"); });
window.addEventListener("mouseup", () => { drag = null; cv.classList.remove("drag"); });
cv.addEventListener("mousemove", e => {
  if (drag) {
    const { pw } = geometry(), dt = (e.clientX - drag.x) / pw * (drag.z[1] - drag.z[0]);
    setZoom(drag.z[0] - dt, drag.z[1] - dt);
    $("tip").style.display = "none";
    return;
  }
  showTip(e);
});
cv.addEventListener("mouseleave", () => { $("tip").style.display = "none"; });
cv.addEventListener("dblclick", () => { state.zoom = null; draw(); });

$("q").addEventListener("input", e => { state.q = e.target.value; renderList(true); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; renderList(false); });
$("onlyDiff").addEventListener("change", e => { state.onlyDiff = e.target.checked; draw(); });
$("showLoose").addEventListener("change", e => { state.showLoose = e.target.checked; draw(); });
document.addEventListener("keydown", e => {
  $("tip").style.display = "none";
  if (e.target.tagName === "INPUT" && e.target.type === "search") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "j" || e.key === "k") {
    e.preventDefault();
    const at = order.findIndex(w => w.id === state.id), next = at + (e.key === "ArrowDown" || e.key === "j" ? 1 : -1);
    if (next >= 0 && next < order.length) select(order[next].id);
  } else if (e.key === "1" || e.key === "2" || e.key === "3") setGroup(+e.key - 1);
  else if (e.key === "d" || e.key === "D") { $("onlyDiff").checked = !$("onlyDiff").checked; state.onlyDiff = $("onlyDiff").checked; draw(); }
  else if (e.key === "m" || e.key === "M") { $("showLoose").checked = !$("showLoose").checked; state.showLoose = $("showLoose").checked; draw(); }
  else if (e.key === "r" || e.key === "R") { state.zoom = null; draw(); }
});
new ResizeObserver(() => draw()).observe($("plot"));

renderChips();
renderList(false);
select(order[0].id);
</script>
</body>
</html>
